name: TenderAI Backend CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: tenderai_test
      DB_USER: ci_user
      DB_PASSWORD: ci_test_password
      SECRET_KEY: "ci-only-secret-key-not-used-in-production-0123456789abcdef"
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      OPENROUTER_API_KEY: ""
      OPENROUTER_MODEL: ""
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: |
          python -m pytest -v
