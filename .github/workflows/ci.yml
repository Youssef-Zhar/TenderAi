name: TenderAI Backend CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - "fix/analysis-report-accuracy"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: tenderai_test
      DB_USER: ci_user
      DB_PASSWORD: ci_test_password
      SECRET_KEY: "ci-only-secret-key-not-used-in-production-0123456789abcdef"
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      OPENROUTER_API_KEY: ""
      OPENROUTER_MODEL: ""
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Run backend tests
        working-directory: backend
        run: |
          python -m pytest -v

      - name: Build backend Docker image
        working-directory: backend
        run: docker build --tag tenderai-api:ci .

  frontend-checks:
    name: Frontend Build and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build
